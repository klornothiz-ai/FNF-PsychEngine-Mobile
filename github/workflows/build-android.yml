name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with: { haxe-version: '4.3.6' }

      - run: mkdir -p ~/haxelib && haxelib setup ~/haxelib

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r21e, link-to-sdk: true }

      - name: Install haxelibs
        run: |
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-tools --quiet
          haxelib install tjson --quiet
          haxelib install flxanimate --quiet
          haxelib install SScript --quiet
          haxelib install hxvlc --quiet
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install extension-androidtools --quiet

      - name: Setup Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "platforms;android-34" "build-tools;34.0.0"
          echo ANDROID_SDK=/usr/local/lib/android/sdk >> $GITHUB_ENV
          echo ANDROID_HOME=/usr/local/lib/android/sdk >> $GITHUB_ENV
          echo ANDROID_SDK_ROOT=/usr/local/lib/android/sdk >> $GITHUB_ENV
          echo ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/21.4.7075529 >> $GITHUB_ENV
          echo ANDROID_SETUP=true >> $GITHUB_ENV

      - name: Build APK
        run: haxelib run lime build android -final

      - uses: actions/upload-artifact@v4
        with: { name: PsychEngine-Android, path: 'export/**/*.apk', if-no-files-found: warn }
